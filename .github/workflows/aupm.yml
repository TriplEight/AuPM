name: AuPM

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  aupm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to a full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install and check reviewed packages
        # actionlint v1.7.12 (pinned) does not parse GitHub's "$/..."
        # self-repository syntax yet; it flags "ref is missing" and fails
        # the lint hook. Switch to "$/..." once a pinned actionlint
        # release supports it.
        uses: ./.github/actions/aupm # zizmor: ignore[self-repository]
        with:
          endpoint: ${{ vars.AUPM_ENDPOINT }}
          lockfile: package-lock.json
          install: none
          fail-on-mismatch: 'false'
          output: aupm-receipt.json

      - name: Upload receipt artifact
        if: always()
        # actions/upload-artifact v4.6.2, pinned to a full commit SHA.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aupm-receipt
          path: aupm-receipt.json
          if-no-files-found: ignore
