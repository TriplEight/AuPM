name: Image

on:
  pull_request:
    paths:
      - proxy/**
      - scripts/record-review.mjs
      - scripts/review-anchor.mjs
      - scripts/network.mjs
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/image.yml
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to a full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1, pinned to a full commit SHA.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Set build identity
        # Expressions go through env, never inline in a run: script
        # (zizmor template-injection rule).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "AUPM_VERSION=pr-${PR_NUMBER}"
            echo "AUPM_COMMIT=${PR_HEAD_SHA}"
          } >> "$GITHUB_ENV"

      - name: Build image
        # docker/build-push-action v7.4.0, pinned to a full commit SHA.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: proxy/Dockerfile
          push: false
          build-args: |
            AUPM_VERSION=${{ env.AUPM_VERSION }}
            AUPM_COMMIT=${{ env.AUPM_COMMIT }}
          labels: |
            org.opencontainers.image.version=${{ env.AUPM_VERSION }}
            org.opencontainers.image.revision=${{ env.AUPM_COMMIT }}

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to a full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1, pinned to a full commit SHA.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        # docker/login-action v4.6.0, pinned to a full commit SHA.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        # github.ref_name goes through env, never inline in a run: script
        # (zizmor template-injection rule).
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "IMAGE_TAG=ghcr.io/tripleight/aupm:${REF_NAME}"
            echo "AUPM_VERSION=${REF_NAME}"
            echo "AUPM_COMMIT=${COMMIT_SHA}"
          } >> "$GITHUB_ENV"

      - name: Build and push image
        # docker/build-push-action v7.4.0, pinned to a full commit SHA.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: proxy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            AUPM_VERSION=${{ env.AUPM_VERSION }}
            AUPM_COMMIT=${{ env.AUPM_COMMIT }}
          labels: |
            org.opencontainers.image.version=${{ env.AUPM_VERSION }}
            org.opencontainers.image.revision=${{ env.AUPM_COMMIT }}
            org.opencontainers.image.source=https://github.com/TriplEight/AuPM
