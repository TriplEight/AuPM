name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to a full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node
        # pnpm/setup v3.0.0, pinned to a full commit SHA. pnpm 11 and later
        # need Node 22 or later.
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.5.1
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install prek
        # j178/prek-action v3.0.0, pinned to a full commit SHA. The
        # official action for prek; it verifies its own release artifact
        # instead of piping a install script straight into a shell.
        # prek-version pins the exact release, matching the version
        # installed locally.
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece
        with:
          prek-version: 0.5.3
          install-only: "true"

      - name: Run prek (guard, Biome, typecheck, secret scan, actionlint, zizmor)
        run: prek run --all-files

      - name: Test proxy
        run: pnpm -C proxy test

      - name: Test contracts
        run: pnpm -C contracts test

      - name: Test mcp
        run: pnpm -C mcp test

      - name: Test cli
        run: pnpm -C cli test

      - name: Test spm-attest action
        run: node --test .github/actions/spm-attest/attest.test.mjs
