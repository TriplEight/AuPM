name: 'AuPM: npm ci and donate to reviewed packages'
description: 'Installs with npm through the AuPM registry, falls back to npm, and donates to reviewed packages only when donate is "true".'
inputs:
  endpoint:
    description: 'URL of the AuPM server.'
    required: true
  lockfile:
    description: 'Path to the lockfile. npm ci runs in its directory.'
    required: false
    default: 'package-lock.json'
  install:
    description: 'Set to "npm" to run npm ci through the AuPM registry, with fallback to npm. Set to "none" to skip the install. Any other value fails the step.'
    required: false
    default: 'npm'
  donate:
    description: 'Set to "true" to donate to the reviewed packages in the lockfile. Off by default.'
    required: false
    default: 'false'
  donor-secret:
    description: 'The donor mnemonic (25 words) of a funded account, from a GitHub secret. MainNet unless the job sets NETWORK: testnet. Read only when donate is "true".'
    required: false
    default: ''
  output:
    description: 'Path to write the signed receipt file.'
    required: false
    default: 'aupm-receipt.json'
  fail-on-mismatch:
    description: 'Set to "true" to fail the step when the summary reports integrityMismatch above zero.'
    required: false
    default: 'false'
outputs:
  output-path:
    description: 'Path to the written signed receipt file.'
    value: ${{ inputs.output }}
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      # Runs first, with the caller's Node and npm. A registry failure falls
      # back to plain npm ci. A plain npm ci failure fails the job.
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
        ENDPOINT: ${{ inputs.endpoint }}
        LOCKFILE: ${{ inputs.lockfile }}
      run: node "${{ github.action_path }}/install.mjs"

    - name: Setup pnpm and Node
      # pnpm/setup v3.0.0, pinned to a full commit SHA. Matches ci.yml.
      id: setup-pnpm
      continue-on-error: true
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
      with:
        version: 12.5.1
        runtime: node@22
        cache: false
        install: false

    - name: Install aupm CLI dependencies
      # Runs in the action's own repository checkout, not the caller's, so
      # cli/ and mcp/ resolve even when this action is called from a
      # third-party repo. Never redden the caller's CI: continue-on-error
      # here, and the run step below checks setup-ok before spawning.
      id: install-deps
      if: steps.setup-pnpm.outcome == 'success'
      continue-on-error: true
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: pnpm install --frozen-lockfile --filter aupm... --filter aupm-mcp...

    - name: Check and donate to reviewed packages
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        LOCKFILE: ${{ inputs.lockfile }}
        FAIL_ON_MISMATCH: ${{ inputs.fail-on-mismatch }}
        OUTPUT: ${{ inputs.output }}
        DONATE: ${{ inputs.donate }}
        # WARNING: only set when donate is 'true'. Never argv, never a log line.
        DONOR_SECRET: ${{ inputs.donate == 'true' && inputs.donor-secret || '' }}
        SETUP_OK: ${{ steps.setup-pnpm.outcome == 'success' && steps.install-deps.outcome == 'success' }}
      run: node "${{ github.action_path }}/run.mjs"
