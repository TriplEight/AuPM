name: 'AuPM: install with npm, pnpm or yarn and donate to reviewed packages'
description: 'Detects the lockfile, installs with npm, pnpm or yarn classic through the AuPM registry, falls back to the public registry, and donates to reviewed packages only when donate is "true".'
inputs:
  endpoint:
    description: 'URL of the AuPM server.'
    required: true
  lockfile:
    description: 'Path to the lockfile. The install command runs in its directory. Empty means: use the one of package-lock.json, pnpm-lock.yaml or yarn.lock in the working directory.'
    required: false
    default: ''
  install:
    description: 'The package manager: "auto" (from the lockfile), "npm", "pnpm" or "yarn" (classic). Each installs through the AuPM registry, with fallback to the public registry. Set to "none" to skip the install. Any other value fails the step.'
    required: false
    default: 'auto'
  donate:
    description: 'Set to "true" to donate to the reviewed packages in the lockfile. Off by default.'
    required: false
    default: 'false'
  donor-secret:
    description: 'The donor mnemonic (25 words) of a funded account, from a GitHub secret. MainNet unless the job sets NETWORK: testnet. Read only when donate is "true".'
    required: false
    default: ''
  output:
    description: 'Path to write the signed receipt file.'
    required: false
    default: 'aupm-receipt.json'
  fail-on-mismatch:
    description: 'Set to "true" to fail the step when the summary reports integrityMismatch above zero.'
    required: false
    default: 'false'
outputs:
  output-path:
    description: 'Path to the written signed receipt file.'
    value: ${{ inputs.output }}
  settlement-txid:
    description: 'The settlement txid of the donation. Empty when nothing was paid.'
    value: ${{ steps.donate.outputs.settlement-txid }}
  donated-micro-usdc:
    description: 'The donated amount in microUSDC. Empty when nothing was paid.'
    value: ${{ steps.donate.outputs.donated-micro-usdc }}
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      # Runs first, with the caller's Node and package managers. A registry
      # failure falls back to the public registry. A failing fallback fails the
      # job. The step outputs the resolved lockfile path for the check step.
      id: install
      shell: bash
      env:
        INSTALL: ${{ inputs.install }}
        ENDPOINT: ${{ inputs.endpoint }}
        LOCKFILE: ${{ inputs.lockfile }}
      run: node "${{ github.action_path }}/install.mjs"

    - name: Check and donate to reviewed packages
      id: donate
      # The install step sets skip-check for yarn berry, which AuPM does not support.
      if: steps.install.outputs.skip-check != 'true'
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        LOCKFILE: ${{ steps.install.outputs.lockfile }}
        FAIL_ON_MISMATCH: ${{ inputs.fail-on-mismatch }}
        OUTPUT: ${{ inputs.output }}
        DONATE: ${{ inputs.donate }}
        # WARNING: only set when donate is 'true'. Never argv, never a log line.
        DONOR_SECRET: ${{ inputs.donate == 'true' && inputs.donor-secret || '' }}
      run: node "${{ github.action_path }}/run.mjs"
