name: Auditor application
description: Apply to review npm packages for AuPM and get paid in USDC.
title: "Auditor application: "
labels: ["auditor-application"]
body:
  - type: markdown
    attributes:
      value: |
        This form starts the MVP auditor process. The process will change after the auditor
        pilot starts.

        Your GitHub login is the login of the account that opens this issue. AuPM maps that
        login to the account address below.

        WARNING: this issue is public. Never write a recovery phrase or a private key here.
  - type: input
    id: address
    attributes:
      label: Account address
      description: The Algorand address that signs your review anchors and receives your USDC.
      placeholder: 58 characters, A-Z and 2-7
    validations:
      required: true
  - type: dropdown
    id: account-type
    attributes:
      label: Account type
      description: >-
        The backup format of the account. Falcon-1024 accounts are not supported yet. See
        [ADR 0028](https://github.com/TriplEight/AuPM/blob/master/docs/adr/0028-account-formats.md).
      options:
        - 25-word Algo25 account (legacy Algorand mnemonic)
        - 24-word Universal Wallet (Pera)
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The account is opted in to USDC (ASA 31566704).
          required: true
        - label: >-
            I understand that this account is a cold wallet: its recovery phrase never goes on a
            computer that is connected to the internet, except in the hidden prompt of an
            `aupm auditor` command.
          required: true
        - label: I keep a copy of the recovery phrase offline, in a safe place.
          required: true
  - type: textarea
    id: experience
    attributes:
      label: Review experience
      description: >-
        Code review or security review work that you did before, with links. The ops decide on
        the application from this record.
    validations:
      required: true
