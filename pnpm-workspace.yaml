packages:
  - contracts
  - proxy
  - mcp
  - cli

# Native and binary dependencies that are allowed to run install scripts.
# pnpm blocks build scripts by default, which this repository relies on. These two
# need a compile step, so a frozen-lockfile install in CI fails without them.
# CAUTION: pnpm reads this list from the workspace root only. A copy of it in a
# package directory has no effect.
# allowBuilds needs pnpm 10.26 or later. pnpm 11 removed onlyBuiltDependencies.
allowBuilds:
  better-sqlite3: true
  esbuild: true

# Transitive advisory patches (S1). Lowest patched version within the major
# version the parent already declares. Never bump @x402-avm/* here.
overrides:
  ws: "8.21.0"
  fast-uri: "3.1.8"
  ip-address: "10.7.1"
  qs: "6.16.0"
  tar: "7.5.21"
  "brace-expansion@5": "5.0.12"
  source-map-js: "1.2.2" # user accepted the 12-day age on 2026-10-12
  nanoid: "3.3.18"
  postcss: "8.5.23"
  esbuild: "0.28.1"
  body-parser: "2.3.0"
  proxy-addr: "2.0.8"
