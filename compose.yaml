# compose.yaml
#
# One service (SPEC.md 10.3, ADR 0001): no database container. The SQLite
# file lives on the named volume "aupm-db", mounted at /data inside the
# container.
#
# This file serves two deploys from one definition:
# - Local machine: `docker compose up --build` builds from `build:` below
#   (proxy/Dockerfile) and reads config from .env (gitignored, never baked
#   into the image — see .dockerignore).
# - Deployed stack: `image:` pins the published tag. Bump it in a commit to
#   deploy a new version; a redeploy pulls that commit (N2). An optional
#   stack.env file next to this compose file supplies variables both for
#   ${VAR} interpolation and, via the env_file entry below, as container
#   environment.
# Either config file may be absent; each entry below is optional.
#
# The operator's record-review flow (SPEC.md §14, ADR 0007) runs against
# this same image and service name, from the repository's proxy/Dockerfile
# WORKDIR (/app/proxy):
#   docker compose run --rm aupm node --import tsx/esm \
#     ../scripts/record-review.mjs <anchorTxid>
# `docker compose run` allocates a TTY by default; record-review.mjs refuses
# to run without one (CLAUDE.md invariant 5), so this only works
# interactively — never with `-T`/`--no-TTY`, and never from a non-interactive
# CI job or cron entry.
#
# The nightly job needs no `docker compose run`. The proxy process
# schedules its own nightly run (ADR 0009); a redeploy of this
# service carries the schedule with it.
#
# AUPM_BACKUP_HOST_DIR (.env.example) is the host directory the nightly
# job's backup step writes a dated `VACUUM INTO` copy to (SPEC.md §13.2
# step 2), bind-mounted at the fixed container path /backup. BACKUP_DIR is
# set here, not read from .env, so the nightly job always writes to the
# mounted path regardless of what a bare, non-Docker `pnpm -C proxy
# nightly` run has BACKUP_DIR set to in .env. `docker compose up` and
# `docker compose run` both refuse to start when AUPM_BACKUP_HOST_DIR is
# unset — deliberately: an unmounted BACKUP_DIR would let the nightly job
# "succeed" while writing its backup inside the throwaway `run --rm`
# container, where it is deleted with the container on exit.
#
# Server secrets (CREDITER_MNEMONIC, ATTEST_SIGNING_KEY) come from Docker
# secrets, not from environment values. `docker compose config`,
# `docker inspect` and a redeploy UI show environment values. They do not
# show a secret file. Each secret is a host file (mode 0400, owner uid 1000),
# mounted at /run/secrets/<name>. The server reads it through
# CREDITER_MNEMONIC_FILE and ATTEST_SIGNING_KEY_FILE. `docker compose up`
# and `docker compose run` refuse to start when a host path variable is
# unset. Keep the plain variables out of .env and stack.env: the server
# refuses to boot when a variable and its _FILE form are both set.

services:
  aupm:
    image: ghcr.io/tripleight/aupm:v0.2.12
    build:
      context: .
      dockerfile: proxy/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: stack.env
        required: false
    environment:
      SQLITE_PATH: /data/audit.db
      BACKUP_DIR: /backup
      CREDITER_MNEMONIC_FILE: /run/secrets/crediter_mnemonic
      ATTEST_SIGNING_KEY_FILE: /run/secrets/attest_signing_key
    secrets:
      - crediter_mnemonic
      - attest_signing_key
    ports:
      - "${PORT:-4873}:4873"
    volumes:
      - aupm-db:/data
      - ${AUPM_BACKUP_HOST_DIR:?set AUPM_BACKUP_HOST_DIR in .env or stack.env to the host backup directory}:/backup
    restart: unless-stopped

secrets:
  crediter_mnemonic:
    file: ${AUPM_CREDITER_MNEMONIC_HOST_FILE:?set AUPM_CREDITER_MNEMONIC_HOST_FILE in .env or stack.env to the host file that holds the crediter mnemonic}
  attest_signing_key:
    file: ${AUPM_ATTEST_SIGNING_KEY_HOST_FILE:?set AUPM_ATTEST_SIGNING_KEY_HOST_FILE in .env or stack.env to the host file that holds the attestation signing key}

volumes:
  aupm-db:
