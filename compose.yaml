# compose.yaml
#
# One service (SPEC.md 10.3, ADR 0001): no database container. The SQLite
# file lives on the named volume "spm-db", mounted at /data inside the
# container. Secrets and configuration come from the host's .env (gitignored,
# never baked into the image — see proxy/Dockerfile and .dockerignore).
#
# The operator's record-review flow (SPEC.md §14, ADR 0007) runs against
# this same image and service name, from the repository's proxy/Dockerfile
# WORKDIR (/app/proxy):
#   docker compose run --rm proxy node --import tsx/esm \
#     ../scripts/record-review.mjs <anchorTxid>
# `docker compose run` allocates a TTY by default; record-review.mjs refuses
# to run without one (CLAUDE.md invariant 5), so this only works
# interactively — never with `-T`/`--no-TTY`, and never from a non-interactive
# CI job or cron entry.
#
# SPM_BACKUP_HOST_DIR (.env.example) is the off-host directory the nightly
# job's backup step writes a dated `VACUUM INTO` copy to (SPEC.md §13.2
# step 2), bind-mounted at the fixed container path /backup. BACKUP_DIR is
# set here, not read from .env, so the nightly job always writes to the
# mounted path regardless of what a bare, non-Docker `pnpm -C proxy
# nightly` run has BACKUP_DIR set to in .env. `docker compose up` and
# `docker compose run` both refuse to start when SPM_BACKUP_HOST_DIR is
# unset — deliberately: an unmounted BACKUP_DIR would let the nightly job
# "succeed" while writing its backup inside the throwaway `run --rm`
# container, where it is deleted with the container on exit.

services:
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/audit.db
      BACKUP_DIR: /backup
      # Q13: public config that goes into every signed attestation. Set
      # here (not left to env_file alone) so `docker compose up` refuses
      # to start without them, the same way SPM_BACKUP_HOST_DIR does below.
      SPM_ISSUER_URL: ${SPM_ISSUER_URL:?set SPM_ISSUER_URL in .env to the https origin the team controls}
      SPM_KEY_VALID_FROM: ${SPM_KEY_VALID_FROM:?set SPM_KEY_VALID_FROM in .env to the attestation key's ISO-8601 UTC provisioning date}
    ports:
      - "${PORT:-4873}:4873"
    volumes:
      - spm-db:/data
      - ${SPM_BACKUP_HOST_DIR:?set SPM_BACKUP_HOST_DIR in .env to the off-host backup directory}:/backup
    restart: unless-stopped

volumes:
  spm-db:
